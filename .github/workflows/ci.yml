name: Test and Build Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/
      - run: npm run lint
      - run: npm run build
      - run: npm run verify
      - run: npm install
        working-directory: ./example-app
      - run: npm run build
        working-directory: ./example-app
      - run: npx cap sync
        working-directory: ./example-app